name: Generate Historical Digests

on:
  workflow_dispatch:  # Manual trigger only

permissions:
  contents: write

jobs:
  generate-historical:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Generate historical digests (past 31 days)
      run: |
        python fetch_arxiv.py --historical

    - name: Commit and push digests
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add digests/ pages/
        git diff --staged --quiet || git commit -m "📚 Generate historical arXiv digests (past 31 days)"
        git push
